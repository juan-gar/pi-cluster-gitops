# Read-only login for Headlamp, for everyday browsing. Bound to the built-in
# `view` ClusterRole: sees workloads, logs, events, config maps - not Secrets,
# and can't change anything.
#
# The token is long-lived (a service-account-token Secret, filled in by the
# cluster - nothing secret is in git). Keep a copy in 1Password (vault K8S) so
# the browser can autofill the Headlamp login:
#   kubectl get secret headlamp-viewer-token -n headlamp \
#     -o jsonpath='{.data.token}' | base64 -d
# Revoke it by deleting the Secret; ArgoCD recreates it with a NEW token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-viewer
  namespace: headlamp
---
# ArgoCD applies ServiceAccounts before Secrets, which this relies on: the
# token controller deletes token Secrets whose ServiceAccount doesn't exist.
apiVersion: v1
kind: Secret
metadata:
  name: headlamp-viewer-token
  namespace: headlamp
  annotations:
    kubernetes.io/service-account.name: headlamp-viewer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: headlamp-viewer
    namespace: headlamp
