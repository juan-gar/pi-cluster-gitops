# Full admin for Headlamp, for the rare job the operator token can't do.
# Deliberately has NO long-lived token Secret - mint a short-lived one when
# you need it, and it expires on its own:
#   kubectl create token headlamp-admin -n headlamp --duration=1h
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-admin
  namespace: headlamp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: headlamp-admin
    namespace: headlamp
