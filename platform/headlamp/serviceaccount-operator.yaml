# Everyday write access for Headlamp: everything `view` allows, plus the
# handful of actions you actually reach for in a UI - delete a pod, restart a
# rollout, scale. Long-lived token like the viewer's (same commands, with
# headlamp-operator-token), kept in 1Password.
#
# Deliberately NOT granted: Secrets, RBAC, CRDs, namespaces, creating
# anything, or pods/exec (a shell in a pod can read whatever it mounts). A
# leaked operator token can disrupt workloads but can't take over the
# cluster. Anything beyond this goes through headlamp-admin
# (serviceaccount-admin.yaml) or kubectl.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-operator
  namespace: headlamp
---
apiVersion: v1
kind: Secret
metadata:
  name: headlamp-operator-token
  namespace: headlamp
  annotations:
    kubernetes.io/service-account.name: headlamp-operator
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-operator
rules:
  # Delete a pod so its controller replaces it.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  # Rollout restart is a patch of the pod template's restartedAt annotation.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-operator-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: headlamp-operator
    namespace: headlamp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-operator
subjects:
  - kind: ServiceAccount
    name: headlamp-operator
    namespace: headlamp
