# Certificate for headlamp.home.juangar.com - LAN-only, same shape and same
# reasoning as certificate-grafana.yaml: it lives in envoy-gateway-system
# because the Gateway listener can only reference Secrets in its own namespace.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: headlamp-home
  namespace: envoy-gateway-system
spec:
  secretName: headlamp-home-tls
  dnsNames:
    - headlamp.home.juangar.com
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
