{{- /*
Same shape as apps/resume/templates/httproute.yaml, plus `timeouts` - see
route.timeouts in values.yaml for why Kavita needs it and the resume site
doesn't.
*/}}
{{- if .Values.route.enabled -}}
{{- $fullName := include "kavita.fullname" . -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "kavita.componentLabels" (dict "ctx" . "component" "server") | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.route.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.route.hostnames | nindent 4 }}
  rules:
    - backendRefs:
        - name: {{ $fullName }}
          port: {{ .Values.service.port }}
      {{- with .Values.route.timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
