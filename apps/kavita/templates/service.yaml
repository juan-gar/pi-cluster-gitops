apiVersion: v1
kind: Service
metadata:
  name: {{ include "kavita.fullname" . }}
  labels:
    {{- include "kavita.componentLabels" (dict "ctx" . "component" "server") | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "kavita.selectorLabels" . | nindent 4 }}
