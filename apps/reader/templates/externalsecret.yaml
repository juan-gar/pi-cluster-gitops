{{- /*
Login passphrase from 1Password. Same pattern as
platform/prometheus/externalsecret-grafana-admin.yaml, including the sync
wave: the Secret has to exist before the Deployment that reads it, or ArgoCD
waits on a pod that can't start.

Changing it in 1Password logs every device out (the session cookie is
derived from it) once ESO refreshes - up to refreshInterval - and the pod
restarts: kubectl rollout restart deploy/reader -n reader.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "reader.fullname" . }}-passphrase
  labels:
    {{- include "reader.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: {{ include "reader.fullname" . }}-passphrase
    creationPolicy: Owner
  data:
    - secretKey: passphrase
      remoteRef:
        key: {{ .Values.passphrase.onePasswordItem }}
        property: {{ .Values.passphrase.onePasswordField }}
