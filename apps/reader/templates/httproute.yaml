{{- if .Values.route.enabled -}}
{{- $fullName := include "reader.fullname" . -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "reader.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.route.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.route.hostnames | nindent 4 }}
  rules:
    - backendRefs:
        - name: {{ $fullName }}
          port: {{ .Values.service.port }}
      # Uploads of up to 50 MB over Wi-Fi need more than Envoy's default
      # 15s request timeout.
      timeouts:
        request: 300s
{{- end }}
